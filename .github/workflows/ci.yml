name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  studio-backend:
    name: Studio backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-studio-dev.txt
      - run: python -m pip install -r requirements-studio-dev.txt
      - run: python -m ruff check backend/studio tests/studio
      - run: python -m pytest -q tests/studio

  studio-frontend:
    name: Studio viewer / Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/studio
      - run: npm run build
      - name: Legacy frontend lint inventory
        run: npm run lint
        continue-on-error: true

  legacy-regression:
    name: Existing app regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . pytest pytest-asyncio
      - run: python -m pytest -q -m 'not live'
