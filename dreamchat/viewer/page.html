<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness viewer</title>
<style>
:root {
  --paper: #f3f4f2; --panel: #ffffff; --ink: #16181b; --muted: #5d636b; --faint: #8b9198; --rule: #d9dcd7;
  --accent: #2b59c3; --accent-soft: #e4ebfa; --prev: #9aa1a8;
  --right: #1f7a45; --wrong: #b3322a; --unsure: #a3680f; --again: #6a4bb6; --confirm: #1f7383;
  --hatch: #eceeea; --warn-bg: #fbf1e3; --shadow: 0 1px 0 rgba(0,0,0,.04);
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1113; --panel: #171a1d; --ink: #e7e9ec; --muted: #a1a7ae; --faint: #7a8189; --rule: #2a2f34;
    --accent: #7ea2ff; --accent-soft: #1d2740; --prev: #6f767e;
    --right: #4fbf7e; --wrong: #ef6b61; --unsure: #e2a543; --again: #a58cf0; --confirm: #5cc2d3;
    --hatch: #1d2125; --warn-bg: #2a2317; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1113; --panel: #171a1d; --ink: #e7e9ec; --muted: #a1a7ae; --faint: #7a8189; --rule: #2a2f34;
  --accent: #7ea2ff; --accent-soft: #1d2740; --prev: #6f767e;
  --right: #4fbf7e; --wrong: #ef6b61; --unsure: #e2a543; --again: #a58cf0; --confirm: #5cc2d3;
  --hatch: #1d2125; --warn-bg: #2a2317; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); display: grid; grid-template-rows: auto 1fr; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* The top bar: which dream, and what the page shows it as. */
header.bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
header.bar h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
header.bar select { padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); max-width: 360px; }
.facts-line { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.facts-line b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border: 1px solid var(--rule); border-radius: 999px; font-size: 12px; white-space: nowrap; }
.pill.warn { border-color: var(--wrong); color: var(--wrong); }
.spacer { flex: 1; }
.linkish { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.linkish:hover { border-color: var(--accent); }

main.split { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
nav.tree { border-right: 1px solid var(--rule); overflow: auto; padding: 8px 0 40px; background: var(--panel); }
nav.tree h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 14px 14px 4px; font-weight: 600; }
nav.tree .group { margin: 2px 0 6px; }
nav.tree .label { padding: 3px 14px; font-size: 12px; color: var(--muted); }
nav.tree .label .t { color: var(--ink); }
nav.tree .shot { margin-left: 14px; border-left: 1px solid var(--rule); }
.row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 4px 14px; cursor: pointer; border-radius: 0; }
.row:hover { background: var(--paper); }
.row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row .id { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 30px; }
.row .what { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }
.dot.right { background: var(--right); border-color: var(--right); }
.dot.wrong { background: var(--wrong); border-color: var(--wrong); }
.dot.unsure { background: var(--unsure); border-color: var(--unsure); }
.dot.again { background: none; border-color: var(--again); border-width: 2.5px; }
.dot.confirm { background: none; border-color: var(--confirm); border-width: 2.5px; }

section.panel { overflow: auto; min-height: 0; padding: 18px 22px 120px; }
.node-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.node-head h2 { margin: 0; font-size: 20px; font-weight: 650; }
.node-head .id { font-family: var(--mono); color: var(--muted); }
.action { font-size: 17px; line-height: 1.4; margin: 6px 0 10px; max-width: 70ch; text-wrap: pretty; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; max-width: 900px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.tag { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--paper); border: 1px solid var(--rule); color: var(--muted); }
.block { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; margin: 14px 0; box-shadow: var(--shadow); }
.block > h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.block > h3 .count { color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 400; }
.issues { background: var(--warn-bg); border-color: var(--unsure); }
.issues li { margin: 2px 0; }

/* The camera: the top view, the mock-up sent, and the cut before's, side by side. */
.camera-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }
figure { margin: 0; }
figcaption { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.shot-img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; display: block; }
.none { width: 100%; aspect-ratio: 16 / 9; border: 1px dashed var(--rule); border-radius: 6px; display: grid; place-items: center; color: var(--faint); font-size: 12.5px; text-align: center; padding: 10px;
  background: repeating-linear-gradient(135deg, transparent 0 8px, var(--hatch) 8px 9px); }
svg.top { width: 100%; aspect-ratio: 5 / 4; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; display: block; }
.camera-words { margin-top: 10px; font-size: 13px; max-width: 90ch; }

/* The images sent, in the prompt's order. */
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ref { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
.ref .thumb { aspect-ratio: 4 / 3; background: var(--paper); display: grid; place-items: center; border-bottom: 1px solid var(--rule); overflow: hidden; }
.ref .thumb img { width: 100%; height: 100%; object-fit: contain; }
.ref .thumb .none { aspect-ratio: auto; height: 100%; border: 0; border-radius: 0; }
.ref .body { padding: 8px 10px 10px; display: grid; gap: 4px; }
.ref .n { font-weight: 650; }
.ref .key { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ref .instr { font-size: 12.5px; }
.ref details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.ref details p { font-size: 12.5px; margin: 4px 0 0; }
.flag { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; }
.flag.sent { color: var(--right); }
.flag.not { color: var(--faint); }
.flag.changed { color: var(--unsure); }
.flag.later { color: var(--muted); }

table.list { border-collapse: collapse; width: 100%; font-size: 13px; }
table.list td, table.list th { text-align: left; padding: 5px 8px; border-top: 1px solid var(--rule); vertical-align: top; }
table.list th { color: var(--faint); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; border-top: 0; }
.jump { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); }

.prompt details { border-top: 1px solid var(--rule); padding: 6px 0; }
.prompt details:first-of-type { border-top: 0; }
.prompt summary { cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.prompt pre, .pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; margin: 4px 0 0; max-width: 110ch; }
.diff .del { background: color-mix(in srgb, var(--wrong) 16%, transparent); }
.diff .add { background: color-mix(in srgb, var(--right) 16%, transparent); }

/* The verdict, always at hand. */
.verdict { position: sticky; bottom: 0; margin: 20px -22px -120px; padding: 12px 22px; background: var(--panel); border-top: 1px solid var(--rule); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 2; }
.verdict .state { font-size: 12.5px; min-width: 180px; }
.vbtn { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.vbtn kbd { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 4px; }
.vbtn[data-v="right"][aria-pressed="true"] { background: var(--right); border-color: var(--right); color: #fff; }
.vbtn[data-v="wrong"][aria-pressed="true"] { background: var(--wrong); border-color: var(--wrong); color: #fff; }
.vbtn[data-v="unsure"][aria-pressed="true"] { background: var(--unsure); border-color: var(--unsure); color: #fff; }
.vbtn.aspect[aria-pressed="true"] { border-color: var(--wrong); color: var(--wrong); box-shadow: inset 0 0 0 1px var(--wrong); }
.verdict textarea { flex: 1 1 280px; min-height: 34px; max-height: 120px; resize: vertical; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; background: var(--paper); }
.verdict .save { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.msg { font-size: 12.5px; }
.msg.err { color: var(--wrong); }

/* The dreamer's own words. */
aside.words { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 92vw); background: var(--panel); border-left: 1px solid var(--rule); transform: translateX(100%); transition: transform .18s ease; z-index: 5; display: grid; grid-template-rows: auto auto 1fr; }
aside.words[aria-hidden="false"] { transform: none; }
aside.words header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
aside.words input { margin: 10px 14px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
aside.words .turns { overflow: auto; padding: 0 14px 20px; }
.turn { margin: 8px 0; }
.turn .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.turn.dreamer .text { border-left: 3px solid var(--accent); padding-left: 8px; }
mark { background: color-mix(in srgb, var(--unsure) 30%, transparent); color: inherit; border-radius: 2px; }
.empty { padding: 60px 20px; color: var(--muted); max-width: 60ch; }
@media (prefers-reduced-motion: reduce) { aside.words { transition: none; } }
@media (max-width: 760px) { main.split { grid-template-columns: 1fr; } nav.tree { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--rule); } }
</style>
</head>
<body>
<header class="bar">
  <h1>Harness viewer</h1>
  <select id="dream" aria-label="Dream"></select>
  <div class="facts-line" id="facts"></div>
  <div class="spacer"></div>
  <button class="linkish" id="wordsBtn" type="button">The dreamer's words</button>
  <button class="linkish" id="themeBtn" type="button" aria-label="Switch light or dark">◐</button>
</header>
<main class="split">
  <nav class="tree" id="tree" aria-label="The dream, top down"></nav>
  <section class="panel" id="panel" aria-live="polite"><div class="empty">Pick a dream.</div></section>
</main>
<aside class="words" id="words" aria-hidden="true" aria-label="The dreamer's own words">
  <header><b>The dreamer's own words</b><div class="spacer"></div><button class="linkish" id="wordsClose" type="button">Close</button></header>
  <input id="wordsFind" type="search" placeholder="Find in the conversation">
  <div class="turns" id="turns"></div>
</aside>
<script>
'use strict';
// State: the dream shown, its verdicts and their states, and the node selected.
let D = null, A = null, S = new Map(), order = [], cur = null, draft = { verdict: null, wrong: new Set(), note: '' };
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
};
const img = (file, alt) => file ? el('img', { src: `/img/${encodeURIComponent(D.header.dream)}/${encodeURIComponent(file.name)}`, alt, loading: 'lazy', class: 'shot-img' }) : null;

// Theme: the viewer's own choice over the system's, remembered on this machine only.
try { const t = localStorage.getItem('viewer-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
$('themeBtn').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const now = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('viewer-theme', next); } catch {}
};

async function loadDreams() {
  const list = await (await fetch('/api/dreams')).json();
  const sel = $('dream');
  sel.replaceChildren(...list.map((d) => el('option', { value: d.id, text: `${d.title} · ${d.id.slice(-4)} · ${d.cuts} cuts${d.fixture ? ' · fixture' : ''}` })));
  if (!list.length) { $('panel').replaceChildren(el('div', { class: 'empty', text: 'No dream has a view yet. Make them with: bun run viewer/build.ts' })); return; }
  const want = new URLSearchParams(location.hash.slice(1)).get('d');
  sel.value = list.some((d) => d.id === want) ? want : list[0].id;
  sel.onchange = () => open(sel.value);
  await open(sel.value, new URLSearchParams(location.hash.slice(1)).get('n'));
}

async function open(id, node) {
  $('panel').replaceChildren(el('div', { class: 'empty', text: 'Reading the dream…' }));
  const r = await fetch(`/api/dream?id=${encodeURIComponent(id)}`);
  const body = await r.json();
  if (!r.ok) { $('panel').replaceChildren(el('div', { class: 'empty', text: body.error })); return; }
  D = body.view; A = body.answers; setStates(body.states);
  renderFacts(); renderTree(); renderWords();
  select(node && order.includes(node) ? node : order.find((n) => D.cuts.some((c) => c.id === n)) ?? order[0]);
}

function setStates(states) { S = new Map(states.map((s) => [s.node, s])); }
const dotClass = (node) => {
  const s = S.get(node);
  if (!s || s.state === 'not read') return 'dot';
  if (s.state === 'read again') return 'dot again';
  if (s.state === 'confirm') return 'dot confirm';
  return `dot ${s.verdict}`;
};
const stateWords = (node) => {
  const s = S.get(node);
  if (!s || s.state === 'not read') return 'Not read yet';
  const v = { right: 'Right', wrong: 'Wrong', unsure: 'Unsure' }[s.verdict];
  if (s.state === 'current') return `${v}, as read`;
  if (s.state === 'read again') return `${v} before; read again: its images, mock-up or camera changed`;
  if (s.state === 'confirm') return `${v} before; confirm: only its ${s.moved.join(' and ')} changed`;
  return v;
};

function renderFacts() {
  const h = D.header;
  const bits = [
    el('span', {}, el('b', { text: D.header.title })),
    el('span', { class: 'pill', text: h.source }),
    el('span', { class: 'mono', text: `commit ${h.commit}` }),
    el('span', { class: `pill${h.profile.full ? '' : ' warn'}`, text: h.profile.full ? 'the full harness' : 'NOT the full harness' }),
    el('span', { text: 'Each cut as it will be sent once everything before it is drawn and approved' }),
  ];
  $('facts').replaceChildren(...bits);
}

function row(node, id, what) {
  return el('button', { class: 'row', type: 'button', 'data-node': node, onclick: () => select(node) },
    el('span', { class: dotClass(node) }), el('span', { class: 'id', text: id }), el('span', { class: 'what', text: what }));
}

function renderTree() {
  const cutsById = new Map(D.cuts.map((c) => [c.id, c]));
  const parts = [el('h2', { text: 'Sheets' })];
  order = [];
  for (const s of D.sheets) { parts.push(row(s.key, s.id, `${s.name}${s.drawn ? '' : ' · not drawn yet'}`)); order.push(s.key); }
  parts.push(el('h2', { text: 'The dream' }));
  for (const q of D.tree) {
    const g = el('div', { class: 'group' }, el('div', { class: 'label', text: `Sequence from ${q.startsAt}${q.splitBy === 'jump' ? ' (a jump)' : ''}` }));
    for (const sc of q.scenes) {
      g.append(el('div', { class: 'label' }, el('span', { class: 't', text: sc.title }), sc.tags.length ? ` · ${sc.tags.join(', ')}` : ''));
      for (const sh of sc.shots) {
        const box = el('div', { class: 'shot' }, el('div', { class: 'label mono', text: sh.id }));
        for (const id of sh.cuts) {
          const c = cutsById.get(id); if (!c) continue;
          const role = (c.tags.find((t) => t.startsWith('role:')) ?? '').slice(5);
          box.append(row(id, id, `${role ? role.replace('_', ' ') + ' · ' : ''}${c.moment.action}`));
          order.push(id);
        }
        g.append(box);
      }
    }
    parts.push(g);
  }
  if (D.ghosts.length) {
    parts.push(el('h2', { text: 'In-between pictures' }));
    for (const g of D.ghosts) { parts.push(row(g.id, g.id, g.change)); order.push(g.id); }
  }
  $('tree').replaceChildren(...parts);
}

function markCurrent() {
  for (const b of document.querySelectorAll('nav.tree .row')) b.setAttribute('aria-current', b.dataset.node === cur ? 'true' : 'false');
  const b = document.querySelector(`nav.tree .row[data-node="${CSS.escape(cur)}"]`);
  if (b) b.scrollIntoView({ block: 'nearest' });
  const p = new URLSearchParams({ d: D.header.dream, n: cur });
  history.replaceState(null, '', `#${p}`);
}

function select(node) {
  cur = node;
  const v = A?.verdicts?.[node];
  draft = { verdict: null, wrong: new Set(v?.wrong ?? []), note: v?.note ?? '' };
  markCurrent();
  const cut = D.cuts.find((c) => c.id === node);
  const ghost = D.ghosts.find((g) => g.id === node);
  const sheet = D.sheets.find((s) => s.key === node);
  const body = cut ? cutPanel(cut) : ghost ? ghostPanel(ghost) : sheet ? sheetPanel(sheet) : [el('div', { class: 'empty', text: 'Nothing here.' })];
  $('panel').replaceChildren(...body, verdictBar());
  $('panel').scrollTop = 0;
  highlightWords();
}

// ── a cut ─────────────────────────────────────────────────────────────────────
function cutPanel(c) {
  const out = [];
  out.push(el('div', { class: 'node-head' }, el('h2', { text: `Picture ${c.order}` }), el('span', { class: 'id', text: c.id }),
    el('span', { class: 'muted', text: `${c.scene} · ${c.shot}` }),
    c.treeDiffers ? el('span', { class: 'pill warn', title: c.treeDiffers, text: `the tree groups it otherwise: ${c.treeDiffers}` }) : null));
  out.push(el('p', { class: 'action', text: c.moment.action }));
  out.push(el('dl', { class: 'kv' },
    el('dt', { text: 'Looks at' }), el('dd', { text: c.moment.looksAt || '—' }),
    el('dt', { text: 'Feeling' }), el('dd', { text: c.moment.feeling || '—' }),
    el('dt', { text: 'Must show' }), el('dd', { text: c.moment.point || '—' }),
    el('dt', { text: 'Whose eyes' }), el('dd', { text: c.moment.eyes === 'dreamer' ? "the dreamer's" : 'from outside' }),
    el('dt', { text: 'Size' }), el('dd', { text: c.camera.size || c.moment.distance || '—' })));
  out.push(el('div', { class: 'tags' }, c.tags.map((t) => el('span', { class: 'tag', text: t }))));
  if (c.issues.length) out.push(el('div', { class: 'block issues' }, el('h3', { text: 'The plan flags' }), el('ul', {}, c.issues.map((i) => el('li', { text: i })))));

  // The camera.
  const prev = c.prevCut ? D.cuts.find((x) => x.id === c.prevCut) : null;
  const mock = c.mockUp
    ? el('figure', {}, img(c.mockUp, `The grey mock-up of ${c.id}`),
        el('figcaption', {}, 'The grey mock-up, rendered from the floor plan', el('span', { class: `flag ${c.mockUp.sent ? 'sent' : 'not'}`, text: c.mockUp.sent ? 'sent as Image 1' : 'not sent' })))
    : el('figure', {}, el('div', { class: 'none', text: c.floor ? 'No mock-up: no camera could be placed for it' : 'No mock-up: no floor plan for this scene' }), el('figcaption', { text: 'The grey mock-up' }));
  const before = prev

    c.camera.eye ? el('div', { class: 'camera-words mono muted', text: `at ${c.camera.eye.x.toFixed(2)}, ${c.camera.eye.y.toFixed(2)} m · ${c.camera.eye.height.toFixed(2)} m high · facing ${c.camera.eye.dir.toFixed(0)}° · ${c.camera.eye.fov.toFixed(0)}° wide${c.camera.eye.lens ? ` · ${c.camera.eye.lens} mm` : ''}` }) : null));

  out.push(el('div', { class: 'block' }, el('h3', {}, 'Images sent, in order', el('span', { class: 'count', text: `${c.refs.length}` })),

  out.push(el('div', { class: 'block' }, el('h3', {}, 'Chosen by the plan and not sent', el('span', { class: 'count', text: `${c.unsent.length}` })),
    c.unsent.length ? el('table', { class: 'list' }, el('tr', {}, el('th', { text: 'Image' }), el('th', { text: 'Why not' }), el('th', { text: 'Detail' })),
      c.unsent.map((u) => el('tr', {}, el('td', { class: 'mono', text: u.key }), el('td', { text: u.code.replaceAll('_', ' ') }), el('td', { text: u.detail }))))
      : el('p', { class: 'muted', text: 'Nothing the plan chose was left out.' })));
  if (c.links.length)
    out.push(el('div', { class: 'block' }, el('h3', { text: 'Drawn from, across the cuts' }),
      el('table', { class: 'list' }, el('tr', {}, el('th', { text: 'From' }), el('th', { text: 'As' }), el('th', { text: 'How it stands to it' })),
        c.links.map((l) => el('tr', {}, el('td', {}, el('button', { class: 'jump', type: 'button', onclick: () => select(l.from), text: l.from })), el('td', { text: l.role }), el('td', { text: (l.relation ?? '—').replaceAll('_', ' ') }))))));

    el('dl', { class: 'kv' },
      el('dt', { text: 'In view' }), el('dd', {}, el('div', { class: 'chips' }, c.facts.inView.map((e) => el('span', { class: 'chip', text: `${e.name} (${e.said})` })))),
      el('dt', { text: 'Changes here' }), el('dd', { text: c.facts.own.map(change).join('; ') || '—' }),
      el('dt', { text: 'Carried from before' }), el('dd', { text: c.facts.carried.map(change).join('; ') || '—' }),
      el('dt', { text: 'How each one is' }), el('dd', { text: c.facts.now.join(' ') || '—' }))));
  out.push(promptBlock(c.prompt, c.paragraphs));
  if (c.drawn) out.push(nightBlock(c));
  return out;
}

const nameOf = (id) => D.sheets.find((s) => s.id === id)?.name ?? id;

// The floor plan from above: the plan's own frame (metres; x to the right facing the front, y away from it).
function topView(c, prev) {
  const NS = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text) e.textContent = text; return e; };
  if (!c.floor) return el('figure', {}, el('div', { class: 'none', text: 'No floor plan for this scene' }), el('figcaption', { text: 'From above' }));
  const f = c.floor, eyes = [c.camera.eye, prev?.camera.eye].filter(Boolean);
  const xs = [...f.spots.map((p) => p.x), ...eyes.map((e) => e.x)], ys = [...f.spots.map((p) => p.y), ...eyes.map((e) => e.y)];
  let [x0, y0, x1, y1] = f.room ? [0, 0, f.room.w, f.room.d] : [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  x0 = Math.min(x0, ...xs) - 1; y0 = Math.min(y0, ...ys) - 1.2; x1 = Math.max(x1, ...xs) + 1; y1 = Math.max(y1, ...ys) + 1;
  const W = x1 - x0, H = y1 - y0;
  const svg = s('svg', { class: 'top', viewBox: `${x0} ${y0} ${W} ${H}`, role: 'img', 'aria-label': `The floor plan from above, with the camera of ${c.id}${prev ? ` and of ${prev.id}` : ''}` });
  const u = Math.max(W, H) / 60; // one stroke unit
  if (f.room) svg.append(s('rect', { x: 0, y: 0, width: f.room.w, height: f.room.d, fill: 'none', stroke: 'var(--faint)', 'stroke-width': u * .6 }));
  // The front, at the top (-y).
  svg.append(s('text', { x: (x0 + x1) / 2, y: y0 + u * 3.2, 'text-anchor': 'middle', 'font-size': u * 2.2, fill: 'var(--muted)' }, `▲ front: ${f.front.words}`));
  const wedge = (e, color, dash, label) => {
    const r = Math.max(W, H) * .55, a = (e.dir * Math.PI) / 180, h = (e.fov * Math.PI) / 360;
    const p1 = [e.x + r * Math.cos(a - h), e.y + r * Math.sin(a - h)], p2 = [e.x + r * Math.cos(a + h), e.y + r * Math.sin(a + h)];
    const g = s('g');
    g.append(s('path', { d: `M${e.x},${e.y} L${p1} L${p2} Z`, fill: color, 'fill-opacity': .1, stroke: color, 'stroke-width': u * .5, 'stroke-dasharray': dash ? `${u * 1.5} ${u}` : 'none' }));
    g.append(s('circle', { cx: e.x, cy: e.y, r: u * 1.1, fill: color }));
    g.append(s('text', { x: e.x + u * 1.6, y: e.y + u * 2.8, 'font-size': u * 2.1, fill: color, 'font-family': 'ui-monospace, monospace' }, label));
    return g;
  };
  if (prev?.camera.eye) svg.append(wedge(prev.camera.eye, 'var(--prev)', true, prev.id));
  if (c.camera.eye) svg.append(wedge(c.camera.eye, 'var(--accent)', false, c.id));
  const placed = [];
  for (const p of f.spots) {
    const inView = c.facts.inView.some((e) => e.id === p.id);
    // Its name above it, or below where another name already sits close by.
    const near = placed.some((q) => Math.abs(q.x - p.x) < 1.6 && Math.abs(q.y - p.y) < .8);
    placed.push(p);
    const col = inView ? 'var(--ink)' : 'var(--faint)';
    if (p.kind === 'thing' || p.w) {
      const w = p.w ?? .5, d = p.d ?? .5;
      svg.append(s('rect', { x: p.x - w / 2, y: p.y - d / 2, width: w, height: d, fill: 'none', stroke: col, 'stroke-width': u * .5 }));
    } else {
      svg.append(s('circle', { cx: p.x, cy: p.y, r: .28, fill: 'var(--panel)', stroke: col, 'stroke-width': u * .6 }));
      if (p.facing) svg.append(s('line', { x1: p.x, y1: p.y, x2: p.x + p.facing.x * .55, y2: p.y + p.facing.y * .55, stroke: col, 'stroke-width': u * .6 }));
    }
    svg.append(s('text', { x: p.x, y: near ? p.y + .45 + u * 2 : p.y - .45, 'text-anchor': 'middle', 'font-size': u * 2, fill: col }, `${p.name}${p.many ? ' (many)' : ''}`));
  }
  return el('figure', {}, svg, el('figcaption', {}, 'From above: ', el('span', { style: 'color: var(--accent)', text: `${c.id}'s camera` }), prev ? el('span', { style: 'color: var(--prev)', text: ` · ${prev.id}'s, dashed` }) : null));
}

    s.prompt ? promptBlock(s.prompt, null) : null,

// ── the verdict ───────────────────────────────────────────────────────────────
function verdictBar() {
  const v = A?.verdicts?.[cur];
  const st = S.get(cur);
  const bar = el('div', { class: 'verdict', role: 'group', 'aria-label': 'Your verdict' });
  const vb = (key, label, k) => el('button', { class: 'vbtn', type: 'button', 'data-v': key, 'aria-pressed': String((draft.verdict ?? v?.verdict) === key), onclick: () => choose(key) }, label, el('kbd', { text: k }));
  const asp = (key, label, k) => el('button', { class: 'vbtn aspect', type: 'button', 'aria-pressed': String(draft.wrong.has(key)), onclick: () => { draft.wrong.has(key) ? draft.wrong.delete(key) : draft.wrong.add(key); refreshBar(); } }, label, el('kbd', { text: k }));
  const showAsp = (draft.verdict ?? v?.verdict) === 'wrong';
  const note = el('textarea', { id: 'note', placeholder: 'A note: what is wrong or why (n)', rows: 1 });
  note.value = draft.note;
  note.addEventListener('input', () => { draft.note = note.value; });
  note.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(draft.verdict ?? v?.verdict); } if (e.key === 'Escape') note.blur(); });
  bar.append(...[el('div', { class: 'state' }, el('span', { class: dotClass(cur) }), ' ', stateWords(cur)),
    vb('right', 'Right', 'r'), vb('wrong', 'Wrong', 'w'), vb('unsure', 'Unsure', 'u'),
    showAsp ? asp('layout', 'Layout', '1') : null, showAsp ? asp('references', 'References', '2') : null, showAsp ? asp('words', 'Words', '3') : null,
    note,
    el('button', { class: 'vbtn save', type: 'button', onclick: () => save(draft.verdict ?? v?.verdict) }, 'Save', el('kbd', { text: '⌘↵' })),
    el('span', { class: 'msg', id: 'msg' })].filter(Boolean));
  if (st?.state === 'confirm' && v?.shown) bar.append(el('details', { style: 'flex-basis: 100%' }, el('summary', { text: 'What changed in the words since your verdict' }), diffView(v.shown.prompt, currentPrompt())));
  return bar;
}
const currentPrompt = () => D.cuts.find((c) => c.id === cur)?.prompt ?? D.ghosts.find((g) => g.id === cur)?.prompt ?? D.sheets.find((s) => s.key === cur)?.prompt ?? '';
function refreshBar() { const old = document.querySelector('.verdict'); if (old) old.replaceWith(verdictBar()); }
function choose(key) {
  // Right and unsure are one key: saved at once. Wrong waits for what is wrong.
  draft.verdict = key;
  if (key === 'wrong') { refreshBar(); return; }
  save(key);
}
async function save(verdict) {
  const msg = () => $('msg');
  if (!verdict) { msg().textContent = 'Choose right, wrong or unsure first.'; msg().className = 'msg err'; return; }
  if (verdict === 'wrong' && !draft.wrong.size) { msg().textContent = 'Say what is wrong: 1 layout, 2 references, 3 words.'; msg().className = 'msg err'; return; }
  const r = await fetch('/api/verdict', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ dream: D.header.dream, node: cur, verdict, wrong: [...draft.wrong], note: draft.note }) });
  const body = await r.json();
  if (!r.ok) { msg().textContent = body.error; msg().className = 'msg err'; return; }
  A = body.answers; setStates(body.states);
  const btn = document.querySelector(`nav.tree .row[data-node="${CSS.escape(cur)}"] .dot`);
  if (btn) btn.className = dotClass(cur);
  draft.verdict = null;
  refreshBar();
  msg().textContent = 'Saved.'; msg().className = 'msg';
}

// A line diff of two texts (the words at the verdict, and now).
function diffView(a, b) {
  const x = a.split('\n'), y = b.split('\n');
  const n = x.length, m = y.length, L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = el('div', { class: 'pre diff' });
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && x[i] === y[j]) { out.append(el('div', { text: `  ${x[i]}` })); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { out.append(el('div', { class: 'add', text: `+ ${y[j]}` })); j++; }
    else { out.append(el('div', { class: 'del', text: `- ${x[i]}` })); i++; }
  }
  return out;
}

// ── the dreamer's words ───────────────────────────────────────────────────────
function renderWords() {
  const box = $('turns');
  if (!D.words) { box.replaceChildren(el('p', { class: 'muted', text: 'This copy keeps no conversation, and this machine has no live copy of it.' })); return; }
  box.replaceChildren(...D.words.map((t) => el('div', { class: `turn ${t.who}`, 'data-turn': t.turn }, el('div', { class: 'who', text: t.who === 'dreamer' ? 'the dreamer' : 'the listener' }), el('div', { class: 'text', text: t.text }))));
  highlightWords();
}
function highlightWords() {
  if (!D?.words) return;
  const find = $('wordsFind').value.trim().toLowerCase();
  const cut = D.cuts.find((c) => c.id === cur);
  // The moment's own longer words, where it is a cut: where the dreamer may have said it.
  const want = find ? [find] : (cut?.moment.action.toLowerCase().match(/[a-z']{5,}/g) ?? []).filter((w) => !['their', 'there', 'about', 'which', 'while', 'dreamer'].includes(w));
  for (const t of document.querySelectorAll('#turns .turn .text')) {
    const turn = D.words.find((w) => String(w.turn) === t.parentElement.dataset.turn);
    const text = turn.text;
    if (!want.length) { t.textContent = text; continue; }
    const re = new RegExp(`(${want.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
    t.replaceChildren(...text.split(re).map((part, k) => (k % 2 ? el('mark', { text: part }) : document.createTextNode(part))));
  }
}
$('wordsFind').addEventListener('input', highlightWords);
$('wordsBtn').onclick = () => { $('words').setAttribute('aria-hidden', 'false'); $('wordsFind').focus(); };
$('wordsClose').onclick = () => $('words').setAttribute('aria-hidden', 'true');

// ── keys ──────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  const typing = ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement?.tagName);
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !D) return;
  const i = order.indexOf(cur);
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); if (i < order.length - 1) select(order[i + 1]); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); if (i > 0) select(order[i - 1]); }
  else if (e.key === 'r') choose('right');
  else if (e.key === 'u') choose('unsure');
  else if (e.key === 'w') choose('wrong');
  else if (['1', '2', '3'].includes(e.key) && (draft.verdict ?? A?.verdicts?.[cur]?.verdict) === 'wrong') {
    const k = ['layout', 'references', 'words'][Number(e.key) - 1];
    draft.wrong.has(k) ? draft.wrong.delete(k) : draft.wrong.add(k); refreshBar();
  } else if (e.key === 'n') { e.preventDefault(); $('note')?.focus(); }
  else if (e.key === 'Escape') $('words').setAttribute('aria-hidden', 'true');
});

loadDreams().catch((e) => $('panel').replaceChildren(el('div', { class: 'empty', text: `Could not read the dreams: ${e}` })));
</script>
